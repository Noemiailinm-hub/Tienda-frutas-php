<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te amo Joahan</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fondo negro con un toque sutil de luz roja/oscura en el centro */
            background: radial-gradient(circle at center, #1a0008 0%, #000000 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Contenedor principal con el corazón translúcido */
        .heart-container {
            position: relative;
            width: 380px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            clip-path: path('M 190,320 C 190,320 350,210 350,120 C 350,65 305,25 250,25 C 215,25 190,55 190,55 C 190,55 165,25 130,25 C 75,25 30,65 30,120 C 30,210 190,320 190,320 Z');
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 50px rgba(255, 42, 95, 0.25);
            animation: pulse-card 3s infinite ease-in-out;
            z-index: 10;
            padding: 25px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Texto más pequeño para una visualización limpia */
        h1 {
            color: #fff;
            font-size: 1.8rem;
            margin: 0;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 75, 110, 0.6);
            letter-spacing: 1px;
            z-index: 11;
        }

        /* Corazones flotantes más grandes y llamativos */
        .heart-3d {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #ff2a5f;
            transform: rotate(45deg);
            animation: float 6s infinite ease-in-out;
            box-shadow: inset -8px -8px 20px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 42, 95, 0.8);
            z-index: 1;
        }

        .heart-3d::before,
        .heart-3d::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            background: #ff2a5f;
            border-radius: 50%;
            box-shadow: inset -5px -5px 15px rgba(0, 0, 0, 0.4);
        }

        .heart-3d::before {
            top: -25px;
            left: 0;
        }

        .heart-3d::after {
            left: -25px;
            top: 0;
        }

        /* Animación de flotación ascendente */
        @keyframes float {
            0% {
                transform: translateY(110vh) rotate(45deg) scale(0.5);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-20vh) rotate(405deg) scale(1.3);
                opacity: 0;
            }
        }

        /* Animación de pulso general */
        @keyframes pulse-card {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <div class="heart-container">
        <h1>Te amo Joahan ❤️</h1>
    </div>

    <script>
        // Función para generar más corazones y con mayor frecuencia
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-3d');
            
            heart.style.left = Math.random() * window.innerWidth + 'px';
            
            const duration = Math.random() * 3 + 4; // Entre 4 y 7 segundos
            heart.style.animationDuration = duration + 's';
            
            const scale = Math.random() * 0.7 + 0.6; // Tamaños más grandes
            heart.style.transform = `scale(${scale}) rotate(45deg)`;
            
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Generar un nuevo corazón cada 120 milisegundos para que haya muchos más flotando
        setInterval(createHeart, 120);
    </script>
</body>
</html>
